<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.css" />
  </head>
  <body>
    <nav id="header" style="height: 150px"></nav>

    <div class="container cart-container">
      <h1 class="mb-4 fw-bold">Shopping Cart</h1>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card product-card">
            <div class="row g-0">
              <div class="col-md-4">
                <img
                  src="../assets/images/Cheese Lovers.jpg"
                  class="product-img w-100"
                  alt="Pizza"
                />
              </div>
              <div class="col-md-8">
                <div class="card-body p-4">
                  <h5 class="card-title fw-bold">Margherita Pizza</h5>
                  <p class="card-text text-muted small">
                    Classic tomato sauce, mozzarella, and fresh basil.
                  </p>
                  <div
                    class="d-flex justify-content-between align-items-center mt-4"
                  >
                    <span class="price-tag"
                      >$<span class="price">15.99</span></span
                    >
                    <div class="qty-controls">
                      <button class="qty-btn" onclick="decrease(event)">
                        -
                      </button>
                      <span class="number fw-bold">0</span>
                      <button class="qty-btn" onclick="increase(event)">
                        +
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="summary-card shadow">
            <h3 class="mb-4">Order Summary</h3>
            <div class="summary-item">
              <span>Subtotal</span>
              <span>$<span class="total-price">0.00</span></span>
            </div>
            <div class="summary-item">
              <span>Delivery</span>
              <span class="text-success fw-bold">FREE</span>
            </div>
            <div class="total-line mt-4">
              <span>Total</span>
              <span>$<span class="total-price">0.00</span></span>
            </div>
            <button class="btn btn-primary checkout-btn">
              Proceed to Checkout
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer id="footer" class="mt-5"></footer>
    <script src="../assets/js/app.js"></script>
  </body>
</html>
